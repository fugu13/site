[package]
name = "site"
version = "0.1.0"
edition = "2024"

# Empty workspace table: this worktree sits one directory below the main
# checkout's own Cargo.toml (which has no [workspace] table), so Cargo's
# workspace-root search could otherwise walk up and misresolve against it.
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
leptos_router = { version = "0.8", features = ["ssr"] }
leptos_meta = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7", features = ["fs", "set-status"] }
grass = "0.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
include_dir = "0.7"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
