name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Reject wasm and unapproved script tags
        run: |
          wasm_hits=$(grep -rl '\.wasm' dist/ || true)
          if [ -n "$wasm_hits" ]; then
            echo "::error::Found .wasm reference(s) under dist/:"
            echo "$wasm_hits" | while IFS= read -r f; do
              echo "::error file=$f::.wasm reference found in $f"
            done
            exit 1
          fi

          # JSON-LD data blocks are inert structured data, not executable script —
          # the one non-analytics <script> form the site deliberately ships.
          bad=$(grep -rhoE '<script[^>]*>' dist/ | grep -vE 'tinyanalytics\.io|simpleanalyticscdn\.com|plausible\.io|type="application/ld\+json"' || true)
          if [ -n "$bad" ]; then
            echo "::error::Found <script> tag(s) not matching an approved analytics domain or JSON-LD:"
            echo "$bad" | while IFS= read -r tag; do
              echo "::error::$tag"
            done
            exit 1
          fi

      - name: Verify required output files
        run: |
          fail=0
          for f in dist/index.html dist/404.html dist/sitemap.xml dist/atom.xml dist/robots.txt; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Required file $f is missing or empty"
              fail=1
            fi
          done
          # The stylesheet's filename carries a content hash (cache busting), so
          # match it by pattern rather than a fixed name.
          stylesheet_count=$(find dist -maxdepth 1 -name 'style.*.css' -size +0c | wc -l)
          if [ "$stylesheet_count" -ne 1 ]; then
            echo "::error::Expected exactly one non-empty dist/style.*.css, found $stylesheet_count"
            fail=1
          fi
          if [ ! -f dist/.nojekyll ]; then
            echo "::error file=dist/.nojekyll::Required file dist/.nojekyll is missing"
            fail=1
          fi
          # Guard against the strip step silently deleting the structured
          # data: every post page must still carry its JSON-LD block.
          if ! grep -rq 'application/ld+json' dist/post/; then
            echo "::error::No JSON-LD structured data found in any post page"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
